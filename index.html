<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="morning-post-shell" content="true">
  <meta name="description" content="The Morning Post shares daily updates on AI advancements.">
  <title>The Morning Post | eSkillsAI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="./site.css?v=20261102-2">
  <link rel="alternate" type="application/rss+xml" title="The Morning Post RSS" href="./feed.xml">
</head>
<body>
  <header class="site-header home-site-header">
    <div class="site-wrap">
      <div class="home-title-row">
        <h1>The Morning Post</h1>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="./about.html">About</a>
          <a class="subscribe-link" href="./subscribe.html">Subscribe</a>
          <a href="./archives/">Archives</a>
          <a href="https://www.linkedin.com/in/gsbapiraju" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </nav>
      </div>
      <p class="hero-copy">A daily look at the latest developments in artificial intelligence.</p>
    </div>
  </header>
  <div class="home-content-surface">
    <main class="edition" id="today">
      <div class="edition-heading"><span>Today's edition</span></div>
      <iframe class="post-frame" id="daily-post" src="./archives/The%20Morning%20post_2026-11-09.html" title="Today's Morning Post" scrolling="no"></iframe>
      <noscript><p>JavaScript is needed to size the daily post correctly. <a href="./today.html">Open today's post</a>.</p></noscript>
    </main>
    <footer class="site-footer">The Morning Post by eSkillsAI | <a href="./archives/">Past editions</a> | <a href="./feed.xml">RSS feed</a></footer>
  </div>
  <script>
    (function(){
      const frame=document.getElementById('daily-post');
      function fit(){
        try{
          const doc=frame.contentDocument;
          if(!doc)return;
          doc.documentElement.style.backgroundColor='#fff';
          if(doc.body)doc.body.style.backgroundColor='#fff';
          const card=doc.querySelector('.card');
          const preview=doc.querySelector('#pvh');
          const pageScroll=doc.defaultView?doc.defaultView.scrollY:0;
          const cardBottom=card?card.getBoundingClientRect().bottom+pageScroll:0;
          const previewBottom=preview?preview.getBoundingClientRect().bottom+pageScroll:0;
          const height=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0,cardBottom,previewBottom);
          frame.style.height=Math.max(800,height+32)+'px';
        }catch(e){}
      }
      frame.addEventListener('load',function(){
        fit();
        try{
          const doc=frame.contentDocument;
          if('ResizeObserver' in window){
            const observer=new ResizeObserver(fit);
            observer.observe(doc.documentElement);
            const card=doc.querySelector('.card');
            if(card)observer.observe(card);
          }
          if(doc.fonts&&doc.fonts.ready){doc.fonts.ready.then(fit);}
        }catch(e){}
        setTimeout(fit,500);
        setTimeout(fit,1500);
      });
      window.addEventListener('resize',fit);
    })();
  </script>
</body>
</html>
