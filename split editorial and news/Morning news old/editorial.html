<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eskillsai Morning Post - Editorial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
<style>

:root{--bg:#EEF0F8;--panel:#fff;--ink:#1B1E3A;--muted:#5A5F7D;--line:#DDE0EE;--acc:#7B2CFF;--field:#F6F7FC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070921;--panel:#12163F;--ink:#E8EAFB;--muted:#A3A8CF;--line:#272C63;--field:#0C0F32}}
:root[data-theme="dark"]{--bg:#070921;--panel:#12163F;--ink:#E8EAFB;--muted:#A3A8CF;--line:#272C63;--field:#0C0F32}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;padding:16px}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.tools{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.dl{background:#FF6A00;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700}
.dl:hover{background:#E65F00}.dl:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;color:var(--muted)}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grp h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.f{display:block;margin-bottom:8px}.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px;font-weight:700}
input[type=text],input:not([type]),textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
:is(input,textarea,select,button):focus-visible{outline:3px solid #FF6A00;outline-offset:1px}
.itm{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.ih{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--acc)}
.x{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.b2{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:700;margin:4px 6px 12px 0}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-weight:700}.chk input{width:auto}
.pvbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:8px}
@media (max-width:900px){.pvbox{position:static}}
#pvh{position:relative;overflow:hidden}
#pv{position:absolute;left:0;top:0;width:1080px;transform-origin:top left}
#xhost{position:fixed;left:-20000px;top:0;width:1080px}
.card{width:1080px;min-height:1350px;background:#fff;color:#1B1E3A;font-family:'Manrope',Arial,sans-serif;line-height:1.5;display:flex;flex-direction:column}
.c-top{display:flex;align-items:center;justify-content:space-between;padding:36px 56px 30px;background:#fff}
.c-top img{display:block;height:92px;width:auto}
.c-ed{text-align:right;font-size:26px;color:#5A5F7D;line-height:1.35}.c-ed b{display:block;font-size:32px;color:#0B0F3B;font-weight:800}
.c-bar{height:10px;background:linear-gradient(90deg,#0A6CFF,#7B2CFF,#FF6A00)}
.c-hero{background:linear-gradient(135deg,#0B0F3B 0%,#2A1C8F 60%,#7B2CFF 100%);color:#fff;padding:56px 56px 52px}
.c-tag{display:inline-block;background:#FF6A00;color:#fff;font-weight:700;font-size:24px;padding:4px 22px;border-radius:99px}
.c-hero h1{font-size:60px;line-height:1.12;margin:24px 0 20px;font-weight:800;letter-spacing:-1px}
.c-hero p{margin:0;font-size:29px;line-height:1.5;color:#D9DBFF}
.c-body{padding:16px 56px 40px;flex:1}
.c-sec{padding-top:34px}
.c-h{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:800;color:#1B1E3A;margin-bottom:6px}
.c-h i{display:block;width:10px;height:42px;border-radius:5px}
.c-it{border-top:2px solid #DDE0EE;padding:22px 0}
.c-src{font-size:23px;font-weight:700;color:#7B2CFF}
.c-ih{font-size:33px;line-height:1.3;font-weight:800;color:#1B1E3A;margin:2px 0 6px}
.c-is{font-size:26px;line-height:1.5;color:#5A5F7D}
.c-q{margin-top:34px;background:#F4F2FF;border-left:10px solid #FF6A00;border-radius:12px;padding:26px 32px;font-size:28px;color:#1B1E3A}
.c-q b{display:block;font-size:30px;margin-bottom:4px}
.c-foot{display:flex;justify-content:space-between;align-items:flex-end;background:#0B0F3B;color:#fff;padding:40px 56px;font-size:28px;font-weight:700}
.c-cur small{display:block;font-size:22px;font-weight:500;color:#AEB3E8}
.c-cur b{display:block;font-size:36px;font-weight:800;margin:2px 0 10px}
.c-cur span{display:block;font-size:20px;font-weight:500;line-height:1.55;color:#D9DBFF}
.c-cur small>span:first-child{font-size:22px;color:#AEB3E8}
.c-cur>span{margin-top:14px;font-size:22px;font-weight:700}
.c-cur>span a{color:#FF8A3D}
.card a{color:inherit;text-decoration:none}.c-top a{display:block}
.c-foot>span:last-child{color:#FF8A3D}

.app{grid-template-columns:minmax(0,1fr);max-width:680px}
</style>
</head>

<script>

const LOGO="";
const COLORS={Purple:"#7B2CFF",Blue:"#0A6CFF",Orange:"#FF6A00",Navy:"#0B0F3B"};
const KEY="eskillsai-morning-post-v13";
const sample={"edition":"🌍 TODAY'S AI WORLD. NO FILTER.","date":"Saturday, October 31, 2026","tag":"🎃 Halloween Edition — Breaking Today","headline":"A human has been injected with an AI-designed virus to kill antibiotic-resistant bacteria. Here is how it is going.","summary":"TechRadar confirmed today: a human subject has received an experimental phage therapy — where the phage itself was designed entirely by AI — targeting antibiotic-resistant bacteria inside the body. The trial is underway. This is the first confirmed case of an AI-designed biological agent administered to a living human for therapeutic purposes.","url":"https://futuretools.io/news","sections":[{"title":"🧬 Science & Medicine","color":"#0A6CFF","items":[{"src":"TechRadar / FutureTools","h":"A human has been injected with an AI-designed virus to kill antibiotic-resistant bacteria","s":"TechRadar confirmed today: an experimental phage designed entirely by AI has been administered to a human subject targeting antibiotic-resistant bacteria. This is the first confirmed case of an AI-designed biological agent used as human therapy. The trial is live.","u":"https://futuretools.io/news"},{"src":"Intel / DEV digest","h":"An explosion at Intel's Israeli fab cuts $300M from Q4 revenue and two points of gross margin","s":"An explosion at the Kiryat Gat plant in Israel in October hit 10-nanometer server production. Despite data-centre and AI revenue hitting $7.3B (up 78%, the fastest growth in fifteen years), Intel's Q4 outlook came in well below forecasts.","u":"https://dev.to/hiroki-ii-ai/ai-daily-digest-october-31-2026-grok-bot-gets-a-wallet-cloud-earnings-diverge-flaws-hit-five-14m7"},{"src":"AI Weekly","h":"Magnetic tape storage is seeing a second lease of life thanks to AI — and its largest maker is ramping production","s":"AI training datasets are so large that tape has become the cheapest long-term storage option. The world's largest tape manufacturer has announced a major production ramp to meet demand from AI labs.","u":"https://futuretools.io/news"}]},{"title":"🤖 Models & Tools","color":"#7B2CFF","items":[{"src":"Anthropic / academy.claude.com","h":"Claude Academy is live: 26 free courses from zero to the API, with LinkedIn certificates","s":"Anthropic publicly launched Claude Academy at academy.claude.com on August 20, 2026, with 26 free courses spanning AI Fluency, Claude Code, MCP, and API development. Four structured learning paths. No subscription required. LinkedIn-shareable certificates included.","u":"https://pasqualepillitteri.it/en/news/12081/claude-academy-live-free-courses-learn-claude"},{"src":"OpenAI / FutureTools","h":"OpenAI doubles Codex and Work allowances across all Pro tiers — scraps the October 30 price cut","s":"OpenAI reversed a planned ChatGPT Pro $200 price reduction and instead doubled Codex and Work session limits across all Pro tiers. The message: more usage, same price, no discount.","u":"https://dev.to/hiroki-ii-ai/ai-daily-digest-october-31-2026-grok-bot-gets-a-wallet-cloud-earnings-diverge-flaws-hit-five-14m7"},{"src":"Alibaba / AI Weekly","h":"Qwen 4 release rumoured for next week — first signals from Alibaba Apsara conference in Amsterdam","s":"Alibaba's Apsara conference in Amsterdam this week carried the first credible signals that Qwen 4 could drop as early as next week. No official announcement yet, but developer chatter is rising fast.","u":"https://aiweekly.co/"},{"src":"xAI / DEV digest","h":"Grok bot gets a wallet: xAI enables autonomous payments for Grok agents","s":"xAI has enabled Grok agents to make purchases autonomously using a pre-authorised wallet. Grok can now book, buy, and pay without asking the user for each transaction — the most significant step toward fully autonomous AI commerce from the xAI ecosystem.","u":"https://dev.to/hiroki-ii-ai/ai-daily-digest-october-31-2026-grok-bot-gets-a-wallet-cloud-earnings-diverge-flaws-hit-five-14m7"},{"src":"Microsoft / DEV digest","h":"Microsoft Copilot gets on-device AI routing: Auto decides what stays local and what goes to the cloud","s":"Experimental access to Microsoft Copilot's on-device AI mode lands in the Copilot app, CLI, and VS Code by end of October. An 'Auto' router decides per task whether to run locally or in the cloud. Tool calls are isolated in Microsoft Execution Containers.","u":"https://dev.to/hiroki-ii-ai/ai-daily-digest-october-31-2026-grok-bot-gets-a-wallet-cloud-earnings-diverge-flaws-hit-five-14m7"}]},{"title":"💰 Cloud Earnings Diverge","color":"#FF6A00","items":[{"src":"Google / FutureTools","h":"Google's Project Suncatcher satellite sends first AI response from orbit via TPU","s":"Google's Project Suncatcher satellite reached a major milestone this week: the first-ever AI response generated by a data-centre-class TPU in orbit. Launched October 1, the prototype received an uplinked prompt near Svalbard, Norway, and ran Gemma 4 open model to produce a haiku about space.","u":"https://futuretools.io/news"},{"src":"ServiceNow","h":"ServiceNow patches CVSS 9.4 sandbox escape in its AI Platform — arbitrary host code execution confirmed","s":"ServiceNow shipped an emergency patch for a critical vulnerability in its Rhino AI Platform sandbox. A CVSS score of 9.4 means attackers could execute arbitrary code on the host. ServiceNow is used by most Fortune 500 companies for IT workflows.","u":"https://aiweekly.co/"},{"src":"Amazon / DEV digest","h":"Amazon reveals internal 'tokenmaxxing' memo warning that AI token usage is a flawed metric","s":"Amazon's internal memo, now circulating publicly, warns that teams are optimising for token counts rather than business outcomes — a phenomenon Amazon calls 'tokenmaxxing'. The memo has gone viral inside enterprise AI circles.","u":"https://dev.to/hiroki-ii-ai/ai-daily-digest-october-31-2026-grok-bot-gets-a-wallet-cloud-earnings-diverge-flaws-hit-five-14m7"},{"src":"Anthropic / AI Weekly","h":"Anthropic launches Claude Smart Reports — and they count off-topic chats in usage","s":"Anthropic shipped Claude Smart Reports for enterprise customers. The feature compiles conversation summaries, usage patterns, and topic breakdowns — and notably counts off-topic conversations in the usage tally, raising questions about what 'productive AI usage' actually means.","u":"https://aiweekly.co/"}]},{"title":"🔐 Security & Governance","color":"#CC0000","items":[{"src":"Forever Security","h":"EMBRACE attack hits built-in browsers of five AI coding tools simultaneously","s":"Researchers at Forever Security disclosed the EMBRACE attack, which breaks the built-in browsers inside Cursor, GitHub Copilot, Codex, VS Code, and Claude Desktop. Patch status is mixed: Cursor was disclosed September 10 and patched by October 1. Others are in various stages.","u":"https://dev.to/hiroki-ii-ai/ai-daily-digest-october-31-2026-grok-bot-gets-a-wallet-cloud-earnings-diverge-flaws-hit-five-14m7"},{"src":"OpenAI / FutureTools","h":"OpenAI files court briefs supporting fair use for AI training in NYT lawsuit","s":"OpenAI published briefs from dozens of supporters — including the US government — arguing AI training on copyrighted works is transformative fair use, causes no measurable market harm, and restricting it would hinder medical research, accessibility tools, and US competitiveness.","u":"https://futuretools.io/news"},{"src":"Mintive / AI Weekly","h":"Agent-identity startup Mintive lands $7M seed — Jeff Dean and Andrej Karpathy as angels","s":"Mintive, which builds verified identity systems for AI agents so they can be trusted when making purchases and decisions, raised $7M seed from Cowboy Ventures. Andrej Karpathy (ex-OpenAI, ex-Tesla) and Jeff Dean (ex-Google) both participated as angels — a signal of the seriousness of agent identity as a category.","u":"https://aiweekly.co/"}]},{"title":"⚖️ Policy & Society","color":"#0B0F3B","items":[{"src":"SCMP","h":"South Korea will file criminal complaints against students caught cheating with AI glasses in exams","s":"Three students were caught wearing or possessing AI-enabled smart glasses during essay exams at Seoul universities. South Korea is now moving to criminal prosecution for AI exam cheating — the first country to take this step.","u":"https://www.scmp.com/topics/artificial-intelligence"},{"src":"SCMP / Asian scientists","h":"Asian scientists look to South Korea as it becomes harder for them to stay in the US","s":"Tech rivalry and immigration pressure are reshaping global talent mobility. South Korea's university president says the knowledge ecosystem is being redrawn — and AI competition is accelerating the shift of top Asian research talent away from the US.","u":"https://www.scmp.com/topics/artificial-intelligence"},{"src":"SCMP","h":"Hong Kong mandates AI education for primary school pupils under a new technology curriculum","s":"Primary school students in Hong Kong will now study AI as part of a new mandatory technology subject — one of the earliest national primary-level AI curricula in Asia.","u":"https://www.scmp.com/topics/artificial-intelligence"},{"src":"DoorDash / FutureTools","h":"DoorDash CEO: AI agents have placed only a few hundred orders vs 3 million daily human deliveries","s":"DoorDash CEO Tony Xu confirmed during Q3 earnings that AI agents — including Meta Muse, Instinct, and Fo — have collectively placed only several hundred orders total on the platform, against an average of 3 million daily human deliveries. The agentic commerce era is real but still tiny.","u":"https://futuretools.io/news"}]},{"title":"🇮🇳 India: AI Infrastructure","color":"#FF6A00","items":[{"src":"TelecomTalk / Bernama","h":"AM Intelligence orders 20,000 more Nvidia Rubin GPUs for India and Malaysia — 100 MW committed","s":"Building on its first Hyderabad AI factory order of 9,000 Vera Rubin GPUs (announced August 25), AM Intelligence (backed by Greenko promoters) has now placed two further binding orders for 20,000 additional Nvidia Rubin GPUs to be deployed in Hyderabad and Malaysia. Total committed capacity approaches 100 MW, with a long-term target of 1 GW globally.","u":"https://telecomtalk.info/nvidia-sends-20000-rubin-gpus-to-india/1012539/"},{"src":"CXO Today / Business Standard","h":"AM Intelligence's Hyderabad AI factory to deliver 450 exaFLOPS of inference compute in Q1 2027","s":"The Hyderabad facility — Asia's first Nvidia Vera Rubin cluster at scale — is engineered to deliver 450 exaFLOPS of NVFP4 inference compute. The Vera Rubin platform cuts AI inference token-serving costs by up to 10x versus the previous Grace Blackwell generation.","u":"https://cxotoday.com/media-coverage/am-intelligence-to-deploy-one-of-asias-first-nvidia-vera-rubin-clusters-bringing-frontier-ai-compute-to-india/"},{"src":"IBG News / Indian Opinion","h":"India's domestic cloud capacity set to reach 8 GW by 2030 — from 1.57 GW today","s":"India's data-centre capacity stood near 1.57 GW in August 2026 and could approach 8 GW by 2030, backed by approximately $70B of committed investment. The IndiaAI Mission has onboarded 45,000+ GPUs. Tata Communications is building a Rs 4,350 crore AI fibre network.","u":"https://ibgnews.com/2026/10/29/india-accelerates-domestic-cloud-infrastructure-to-strengthen-data-sovereignty-and-ai-capabilities/"}]},{"title":"🇮🇳 India: Skills & Startups","color":"#7B2CFF","items":[{"src":"AI Weekly","h":"Claude Academy launches in India with full Hindi-language course catalogue","s":"All 26 Claude Academy courses are now available in Hindi at academy.claude.com, making Anthropic's free AI training directly accessible to India's 600-million-plus Hindi speakers — the largest language expansion of any frontier AI learning platform in 2026.","u":"https://pasqualepillitteri.it/hi/news/12093/claude-academy-muft-course-claude"},{"src":"Analytics India Magazine","h":"SAP India targets 2 million people for AI skilling by 2030","s":"SAP India's October 28 plan covers AI, cloud, data, and enterprise technologies with academic and industry partners. India accounts for nearly 48% of SAP's certified learners worldwide, and 13% of the 2-million target are already enrolled.","u":"https://analyticsindiamag.com/ai-news/sap-india-targets-2-million-people-for-ai-skilling-by-2030"},{"src":"VARINDIA / MediaNama","h":"Sarvam AI signs a five-year AI framework with India's armed forces — Army, Navy, and Air Force","s":"The MoU with HQ Integrated Defence Staff covers decision support, target acquisition, and data fusion across all three services using Sarvam 105B and its defence unit Chanakya. Human oversight stays on operational decisions.","u":"https://www.varindia.com/news/sarvam-to-build-ai-tools-for-all-three-armed-forces-under-five-year-defence-mou"},{"src":"People Matters","h":"Indian IT hiring diverges sharply: HCLTech adds 6,450 while Wipro sheds 6,716 in Q2","s":"In the September quarter HCLTech grew to 230,339 staff and Infosys added 4,480 (332,542 total), while Wipro fell 2.8% to 236,328. TCS reported 598,056 employees. The split reflects AI's uneven impact across the sector.","u":"https://www.peoplematters.in/amp/news/business/indian-it-hiring-in-q2-hcltech-adds-6450-employees-as-wipro-loses-6716-52954"},{"src":"Zerodha Daily Brief","h":"Indian IT faces AI deflation: clients demand lower prices where AI cuts effort — renewals now reflect it","s":"Clients are writing AI-related cost give-backs into IT contract renewals. Outcome-based pricing is growing. Wipro's AI-native unit and HCLTech both cited deals where AI reduced per-unit delivery cost — and the savings went to the client, not the vendor.","u":"https://thedailybrief.zerodha.com/p/the-uncertain-fates-of-indias-inter"}]},{"title":"📚 Learn AI Today","color":"#0A6CFF","items":[{"src":"Anthropic / academy.claude.com","h":"Claude Academy: 26 free courses from Anthropic — AI Fluency, Claude Code, MCP, API (no subscription)","s":"From first chatbot interaction to building production API apps, Claude Academy at academy.claude.com covers four structured tracks. Certificates are free and shareable on LinkedIn. All 26 courses updated for Claude Sonnet 5 and Claude Opus 5.","u":"https://pasqualepillitteri.it/en/news/12081/claude-academy-live-free-courses-learn-claude"},{"src":"Anthropic","h":"Anthropic Frontier Academy: $100M to train 10,000 engineers in frontier AI development in 2027","s":"Anthropic announced Frontier Academy — a $100M programme to train 10,000 engineers in frontier AI development, safety, and deployment starting in 2027. Applications open November 15, 2026.","u":"https://pasqualepillitteri.it/en/news/cat/723"},{"src":"Pasquale Pillitteri","h":"Best open-weight models in October 2026 compared — Kimi K3, Mistral Large 4, Qwen 3.8 Max","s":"An updated benchmark comparison of the best freely downloadable models this month: Kimi K3 (2.8T parameters, #1 coding), Mistral Large 4 Le Chonk (1T, MIT), and Qwen 3.8 Max (2.4T, Apache 2.0). All three are competitive with closed models from six months ago.","u":"https://pasqualepillitteri.it/en/news/cat/723"}]}],"qOn":true,"qTitle":"💡 Question of the day","q":"An AI designed a virus now inside a human body. A satellite is answering AI prompts from orbit. Grok agents are making purchases without asking. Students are being criminally charged for using AI glasses. And 26 free courses can teach anyone to build with frontier AI — today. Halloween 2026 is the strangest day in AI history. What scares you most — and what excites you most?","curated":"Curated by\nDr. G.S. Bapi Raju\nFounder & CEO, eskillsai.com\nFormer Professor, Computer Science & Engg.\nPh.D, M.Tech (CSE), M.Sc (Nuclear Physics), MBA (HR & FIN),\nIDCPA, NCC (UK) | MCSE | CCNA | AWS | PCCET\nLife Member: CSI & ISTE","site":"eskillsai.com"};
const clone=o=>JSON.parse(JSON.stringify(o));
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||clone(sample);
const $=s=>document.querySelector(s), ed=$("#ed");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
const bc=(()=>{try{return new BroadcastChannel(KEY)}catch(e){return null}})();
function render(){persist();if(bc)bc.postMessage("u")}
const fld=(l,h)=>`<label class="f"><span>${l}</span>${h}</label>`;
const inp=(a,v)=>`<input type="text" ${a} value="${esc(v)}">`;
const ta=(a,v)=>`<textarea ${a}>${esc(v)}</textarea>`;
function buildEditor(){
 ed.innerHTML=`<div class="grp"><h3>Header</h3>${fld("Edition name",inp('data-k="edition"',S.edition))}${fld("Date",inp('data-k="date"',S.date))}</div>
 <div class="grp"><h3>Lead story</h3>${fld("Label",inp('data-k="tag"',S.tag))}${fld("Headline",ta('data-k="headline"',S.headline))}${fld("Summary",ta('data-k="summary" style="min-height:110px"',S.summary))}${fld("Link (optional)",inp('data-k="url"',S.url))}</div>`+
 S.sections.map((sc,si)=>`<div class="grp"><h3>Section ${si+1}<button class="x" data-a="delSec" data-si="${si}">Remove section</button></h3>${fld("Heading",inp(`data-si="${si}" data-f="title"`,sc.title))}
 <label class="f"><span>Colour</span><select data-si="${si}" data-f="color">${Object.entries(COLORS).map(([n,v])=>`<option value="${v}"${v===sc.color?" selected":""}>${n}</option>`).join("")}</select></label>`+
 sc.items.map((it,ii)=>`<div class="itm"><div class="ih">Story ${ii+1}<button class="x" data-a="delItem" data-si="${si}" data-ii="${ii}">Remove</button></div>${fld("Source (optional)",inp(`data-si="${si}" data-ii="${ii}" data-f="src"`,it.src))}${fld("Headline",ta(`data-si="${si}" data-ii="${ii}" data-f="h" style="min-height:52px"`,it.h))}${fld("Summary (optional)",ta(`data-si="${si}" data-ii="${ii}" data-f="s"`,it.s))}${fld("Link (optional)",inp(`data-si="${si}" data-ii="${ii}" data-f="u"`,it.u))}</div>`).join("")+
 `<button class="b2" data-a="addItem" data-si="${si}">Add story</button></div>`).join("")+
 `<button class="b2" data-a="addSec">Add section</button>
 <div class="grp"><h3>Question box</h3><label class="chk"><input type="checkbox" data-k="qOn"${S.qOn?" checked":""}> Show this box</label>${fld("Title",inp('data-k="qTitle"',S.qTitle))}${fld("Text",ta('data-k="q"',S.q))}</div>
 <div class="grp"><h3>Footer</h3>${fld("Curator block (one line per row)",ta('data-k="curated" style="min-height:150px"',S.curated))}${fld("Right text",inp('data-k="site"',S.site))}</div>
 <button class="b2" data-a="clear">Clear all text</button><button class="b2" data-a="reset">Restore sample</button>`;
}
function onEdit(e){const t=e.target,d=t.dataset;
 if(d.k){S[d.k]=t.type==="checkbox"?t.checked:t.value}
 else if(d.ii!==undefined){S.sections[d.si].items[d.ii][d.f]=t.value}
 else if(d.si!==undefined&&d.f){S.sections[d.si][d.f]=t.value}
 else return; render()}
ed.addEventListener("input",onEdit);ed.addEventListener("change",onEdit);
ed.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const d=b.dataset,si=+d.si,ii=+d.ii,a=d.a;
 if(a==="addItem")S.sections[si].items.push({src:"",h:"",s:"",u:""});
 else if(a==="delItem")S.sections[si].items.splice(ii,1);
