<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eskillsai Morning Post Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#EEF0F8;--panel:#fff;--ink:#1B1E3A;--muted:#5A5F7D;--line:#DDE0EE;--acc:#7B2CFF;--field:#F6F7FC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070921;--panel:#12163F;--ink:#E8EAFB;--muted:#A3A8CF;--line:#272C63;--field:#0C0F32}}
:root[data-theme="dark"]{--bg:#070921;--panel:#12163F;--ink:#E8EAFB;--muted:#A3A8CF;--line:#272C63;--field:#0C0F32}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;padding:16px}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.tools{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.dl{background:#FF6A00;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700}
.dl:hover{background:#E65F00}.dl:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;color:var(--muted)}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grp h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.f{display:block;margin-bottom:8px}.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px;font-weight:700}
input[type=text],input:not([type]),textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
:is(input,textarea,select,button):focus-visible{outline:3px solid #FF6A00;outline-offset:1px}
.itm{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.ih{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--acc)}
.x{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.b2{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:700;margin:4px 6px 12px 0}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-weight:700}.chk input{width:auto}
.pvbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:8px}
@media (max-width:900px){.pvbox{position:static}}
#pvh{position:relative;overflow:hidden}
#pv{position:absolute;left:0;top:0;width:1080px;transform-origin:top left}
#xhost{position:fixed;left:-20000px;top:0;width:1080px}
.card{width:1080px;min-height:1350px;background:#fff;color:#1B1E3A;font-family:'Manrope',Arial,sans-serif;line-height:1.5;display:flex;flex-direction:column}
.c-top{display:flex;align-items:center;justify-content:space-between;padding:36px 56px 30px;background:#fff}
.c-top img{display:block;height:92px;width:auto}
.c-ed{text-align:right;font-size:26px;color:#5A5F7D;line-height:1.35}.c-ed b{display:block;font-size:32px;color:#0B0F3B;font-weight:800}
.c-bar{height:10px;background:linear-gradient(90deg,#0A6CFF,#7B2CFF,#FF6A00)}
.c-hero{background:linear-gradient(135deg,#0B0F3B 0%,#2A1C8F 60%,#7B2CFF 100%);color:#fff;padding:56px 56px 52px}
.c-tag{display:inline-block;background:#FF6A00;color:#fff;font-weight:700;font-size:24px;padding:4px 22px;border-radius:99px}
.c-hero h1{font-size:60px;line-height:1.12;margin:24px 0 20px;font-weight:800;letter-spacing:-1px}
.c-hero p{margin:0;font-size:29px;line-height:1.5;color:#D9DBFF}
.c-body{padding:16px 56px 40px;flex:1}
.c-sec{padding-top:34px}
.c-h{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:800;color:#1B1E3A;margin-bottom:6px}
.c-h i{display:block;width:10px;height:42px;border-radius:5px}
.c-it{border-top:2px solid #DDE0EE;padding:22px 0}
.c-src{font-size:23px;font-weight:700;color:#7B2CFF}
.c-ih{font-size:33px;line-height:1.3;font-weight:800;color:#1B1E3A;margin:2px 0 6px}
.c-is{font-size:26px;line-height:1.5;color:#5A5F7D}
.c-q{margin-top:34px;background:#F4F2FF;border-left:10px solid #FF6A00;border-radius:12px;padding:26px 32px;font-size:28px;color:#1B1E3A}
.c-q b{display:block;font-size:30px;margin-bottom:4px}
.c-foot{display:flex;justify-content:space-between;align-items:flex-end;background:#0B0F3B;color:#fff;padding:40px 56px;font-size:28px;font-weight:700}
.c-cur small{display:block;font-size:22px;font-weight:500;color:#AEB3E8}
.c-cur b{display:block;font-size:36px;font-weight:800;margin:2px 0 10px}
.c-cur span{display:block;font-size:11px;font-weight:500;line-height:1.6;color:#D9DBFF}
.card a{color:inherit;text-decoration:none}.c-top a{display:block}
.c-foot>span:last-child{color:#FF8A3D}
</style>
</head>

const sample={"edition":"🌍 TODAY'S AI WORLD. NO FILTER.","date":"Wednesday, October 28, 2026","tag":"🔥 Breaking Today","headline":"Anthropic trained Claude on Stanford professors' copyrighted books — without permission. One day after filing its IPO.","summary":"The Stanford Daily confirmed Anthropic used illegally obtained works by Stanford professors to train Claude. The story exploded on Hacker News — reigniting the AI training data copyright debate at the most critical moment possible: one day after Anthropic filed its S-1 with the SEC for a November 16 Nasdaq listing as ANT. If proven, it could materially impact the IPO.","sections":[{"title":"🔥 Viral on AI Today","color":"#FF6A00","items":[{"src":"Hacker News — 614 upvotes","h":"'AI promised to reduce my workload. I have never been this busy.'","s":"A viral essay by a senior software engineer trending at 614 points on Hacker News argues that AI coding agents didn't shrink his workload — they expanded it. AI made side-fixes cheap, so now everything gets fixed. The result: more work, not less. The most honest AI productivity take of 2026.","u":"https://aiweekly.co/ai-news-today"},{"src":"Hacker News — 428 upvotes","h":"'The Mythical Man-Month in the Age of AI' — viral essay on software engineering management","s":"A modern reread of Fred Brooks' 1975 classic, now trending globally. The argument: AI doesn't solve the core problem of software complexity — it just makes individual developers faster while multiplying the number of decisions that must be made. Adding AI to a late project makes it later.","u":"https://aiweekly.co/ai-news-today"}]},{"title":"⚖️ AI and the Law: Three Explosive Stories","color":"#CC0000","items":[{"src":"Stanford Daily / Hacker News","h":"Anthropic trained Claude on Stanford professors' copyrighted books — without permission","s":"The Stanford Daily confirmed Anthropic used illegally obtained academic works by Stanford professors to train Claude. Story exploded on Hacker News one day after Anthropic's IPO S-1 filing. If proven in court, the liability could materially affect the November 16 Nasdaq listing.","u":"https://aiweekly.co/ai-news-today"},{"src":"Gizmodo / Hacker News","h":"Police are using AI to pull over drivers for 'suspicious behaviour' — with no human review","s":"Law enforcement agencies are deploying AI to analyse driver behaviour in real time and flag vehicle stops automatically. Privacy advocates call it algorithmic profiling at scale. The story is trending on Hacker News with alarm from both sides of the political spectrum.","u":"https://gizmodo.com/police-are-using-ai-to-pull-over-drivers-for-suspicious-behavior-2000831220"},{"src":"Reuters / South Korean Police","h":"AI-assisted hacker arrested for stealing 8.2 million personal records from 90 organisations","s":"South Korean police arrested seven suspects led by a self-taught 32-year-old hacker who used AI tools to breach roughly 90 organisations between September 2025 and October 2026. 8.2 million records stolen including names, resident registration numbers, and home addresses.","u":"https://aiweekly.co/ai-news-today"}]},{"title":"🚀 AI Tools and Models: What Dropped Today","color":"#0A6CFF","items":[{"src":"Google DeepMind / AI Weekly","h":"Google DeepMind launches Genie 4 — generates fully playable 3D environments from a single image","s":"Genie 4 generates fully interactive, playable 3D environments from a single image or text prompt in real time. The most advanced world-simulation model ever released publicly — with major implications for gaming, robotics training, and autonomous agent development. Launched today with zero prior announcement.","u":"https://aiweekly.co/"},{"src":"Apple / The Verge","h":"Apple's M6 Macs run on-device AI 13x faster than M1 — at $1,499 starting price","s":"New M6 iMac and 14-inch MacBook Pro launched today with a dual 16-core Neural Engine. On-device AI runs 13x faster than the original M1. Every AI task — summarisation, transcription, coding assistance — now happens locally, privately, and instantly. No cloud. No subscription.","u":"https://aiweekly.co/"},{"src":"Oracle / AI Weekly","h":"Oracle puts ChatGPT and Codex inside enterprise apps — opens OCI to rival chips","s":"ChatGPT and OpenAI's Codex are now embedded across Oracle's entire enterprise application suite. Simultaneously, Oracle opened its OCI cloud to non-Nvidia chips — SambaNova, Cerebras, and AMD. A major shift in the enterprise AI stack away from Nvidia dependency, confirmed today.","u":"https://aiweekly.co/"}]},{"title":"📉 AI Industry: The Cracks Showing Today","color":"#7B2CFF","items":[{"src":"Amazon / CNBC","h":"Amazon is gutting its internal AI division after sustained failure to ship competitive products","s":"Amazon confirmed significant cuts to its internal AI division today — citing sustained failure to ship competitive AI products. The company that hosts Anthropic and powers much of the world's AI cloud is simultaneously cutting the team that was supposed to build its own frontier models.","u":"https://aiweekly.co/ai-news-today"},{"src":"AI Weekly / CoreWeave","h":"CoreWeave debt hits distress levels — Big Tech reports AI spending figures on Wednesday","s":"CoreWeave's high-yield bonds hit distress territory today as all major tech companies — Google, Microsoft, Meta, Amazon — report quarterly AI infrastructure spending simultaneously this week. The market is watching to see if the numbers justify the debt. So far, CoreWeave's bondholders are not convinced.","u":"https://aiweekly.co/"},{"src":"Financial Times / AI Weekly","h":"Stealth UK police AI startup 22one hits $400M valuation — with no public product","s":"A stealth British startup building AI tools for law enforcement hit a $400M valuation today without a single public product launch. It joins a growing list of AI companies valued in the hundreds of millions before shipping anything. The AI valuation bubble is now visible in law enforcement tech.","u":"https://aiweekly.co/"}]}],"qOn":true,"qTitle":"💡 Question of the day","q":"AI promised to make us more productive. Engineers say they have never been busier. AI promised to reduce crime. Police are using it to stop drivers with no human oversight. AI promised to be ethical. Anthropic trained on stolen books the day before its IPO. Which AI promise do you still believe?","curated":"Curated by | Dr. G.S. Bapi Raju | Founder & CEO, eskillsai.com | Former Professor, Computer Science & Engg. | Ph.D, M.Tech, M.Sc, MBA, IDCPA, NCC (UK) | MCSE | CCNA | AWS | PCCET | Life Member: CSI & ISTE","site":"eskillsai.com","url":"https://aiweekly.co/ai-news-today"};

  return its||sc.title?`<div class="c-sec"><div class="c-h"><i style="background:${esc(sc.color)}"></i>${esc(sc.title)}</div>${its}</div>`:"";
 }).join("");
 return `<div class="card"><div class="c-top">${lk("https://eskillsai.com",`<img src="${LOGO}" alt="eskillsai.com">`)}<div class="c-ed"><b>${esc(S.edition)}</b>${esc(S.date)}</div></div><div class="c-bar"></div>`+
 (S.headline||S.summary?`<div class="c-hero">${S.tag?`<span class="c-tag">${esc(S.tag)}</span>`:""}<h1>${lk(S.url,esc(S.headline))}</h1><p>${esc(S.summary)}</p></div>`:"")+
 `<div class="c-body">${secs}${S.qOn&&(S.q||S.qTitle)?`<div class="c-q"><b>${esc(S.qTitle)}</b>${esc(S.q)}</div>`:""}</div>`+
 `<div class="c-foot">${curBlock()}<span>${lk(S.site,esc(S.site))}</span></div></div>`;
}
function fit(){const k=Math.min(1,pvh.clientWidth/1080);pv.style.transform=`scale(${k})`;pvh.style.height=Math.ceil(pv.offsetHeight*k)+"px"}
function render(){pv.innerHTML=cardHTML();fit();persist()}
window.addEventListener("resize",fit);

const fld=(l,h)=>`<label class="f"><span>${l}</span>${h}</label>`;
const inp=(a,v)=>`<input type="text" ${a} value="${esc(v)}">`;
const ta=(a,v)=>`<textarea ${a}>${esc(v)}</textarea>`;
function buildEditor(){
 ed.innerHTML=`<div class="grp"><h3>Header</h3>${fld("Edition name",inp('data-k="edition"',S.edition))}${fld("Date",inp('data-k="date"',S.date))}</div>
 <div class="grp"><h3>Lead story</h3>${fld("Label",inp('data-k="tag"',S.tag))}${fld("Headline",ta('data-k="headline"',S.headline))}${fld("Summary",ta('data-k="summary" style="min-height:110px"',S.summary))}${fld("Link (optional)",inp('data-k="url"',S.url))}</div>`+
 S.sections.map((sc,si)=>`<div class="grp"><h3>Section ${si+1}<button class="x" data-a="delSec" data-si="${si}">Remove section</button></h3>${fld("Heading",inp(`data-si="${si}" data-f="title"`,sc.title))}
 <label class="f"><span>Colour</span><select data-si="${si}" data-f="color">${Object.entries(COLORS).map(([n,v])=>`<option value="${v}"${v===sc.color?" selected":""}>${n}</option>`).join("")}</select></label>`+
 sc.items.map((it,ii)=>`<div class="itm"><div class="ih">Story ${ii+1}<button class="x" data-a="delItem" data-si="${si}" data-ii="${ii}">Remove</button></div>${fld("Source (optional)",inp(`data-si="${si}" data-ii="${ii}" data-f="src"`,it.src))}${fld("Headline",ta(`data-si="${si}" data-ii="${ii}" data-f="h" style="min-height:52px"`,it.h))}${fld("Summary (optional)",ta(`data-si="${si}" data-ii="${ii}" data-f="s"`,it.s))}${fld("Link (optional)",inp(`data-si="${si}" data-ii="${ii}" data-f="u"`,it.u))}</div>`).join("")+
 `<button class="b2" data-a="addItem" data-si="${si}">Add story</button></div>`).join("")+
 `<button class="b2" data-a="addSec">Add section</button>
 <div class="grp"><h3>Question box</h3><label class="chk"><input type="checkbox" data-k="qOn"${S.qOn?" checked":""}> Show this box</label>${fld("Title",inp('data-k="qTitle"',S.qTitle))}${fld("Text",ta('data-k="q"',S.q))}</div>
 <div class="grp"><h3>Footer</h3>${fld("Curator block (one line per row)",ta('data-k="curated" style="min-height:150px"',S.curated))}${fld("Right text",inp('data-k="site"',S.site))}</div>
 <button class="b2" data-a="clear">Clear all text</button><button class="b2" data-a="reset">Restore sample</button>`;
}
function onEdit(e){const t=e.target,d=t.dataset;
 if(d.k){S[d.k]=t.type==="checkbox"?t.checked:t.value}
 else if(d.ii!==undefined){S.sections[d.si].items[d.ii][d.f]=t.value}
 else if(d.si!==undefined&&d.f){S.sections[d.si][d.f]=t.value}
 else return; render()}
ed.addEventListener("input",onEdit);ed.addEventListener("change",onEdit);
ed.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const d=b.dataset,si=+d.si,ii=+d.ii,a=d.a;
 if(a==="addItem")S.sections[si].items.push({src:"",h:"",s:"",u:""});
 else if(a==="delItem")S.sections[si].items.splice(ii,1);
 else if(a==="addSec")S.sections.push({title:"New section",color:"#0A6CFF",items:[{src:"",h:"",s:"",u:""}]});
 else if(a==="delSec")S.sections.splice(si,1);
 else if(a==="reset"){if(!confirm("Replace everything with the sample issue?"))return;S=clone(sample)}
 else if(a==="clear"){if(!confirm("Clear all text and keep the layout?"))return;S.date=today();S.tag="";S.headline="";S.summary="";S.url="";S.q="";S.sections.forEach(s=>s.items=[{src:"",h:"",s:"",u:""}])}
 buildEditor();render()});

let dl=null;
async function initDl(){try{dl=window.claude&&claude.use?await claude.use("downloads"):null}catch(e){dl=null}
 if(dl)document.querySelectorAll(".dl").forEach(b=>b.disabled=false);else msg.textContent="Downloads are not available in this view."}
async function grab(){await document.fonts.ready;xhost.innerHTML=cardHTML();const card=xhost.firstElementChild,cr=card.getBoundingClientRect();const c=await html2canvas(card,{scale:2,backgroundColor:"#ffffff",useCORS:true});c._links=[];card.querySelectorAll("a[data-url]").forEach(a=>{for(const r of a.getClientRects())c._links.push({x:r.left-cr.left,y:r.top-cr.top,w:r.width,h:r.height,u:a.getAttribute("data-url")})});xhost.innerHTML="";return c}
async function exportAs(kind){if(!dl)return;msg.textContent="Preparing...";
 try{const c=await grab(),w=c.width/2,h=c.height/2,name="eskillsai-morning-post-"+new Date().toISOString().slice(0,10)+"."+kind;let blob;
  if(kind==="png")blob=await new Promise(r=>c.toBlob(r,"image/png"));
  else{const pdf=new window.jspdf.jsPDF({orientation:h>=w?"p":"l",unit:"px",format:[w,h],hotfixes:["px_scaling"]});pdf.addImage(c.toDataURL("image/jpeg",0.93),"JPEG",0,0,w,h);(c._links||[]).forEach(l=>pdf.link(l.x,l.y,l.w,l.h,{url:l.u}));blob=pdf.output("blob")}
  await dl.save({filename:name,data:blob});msg.textContent=""}
 catch(e){xhost.innerHTML="";msg.textContent=e&&e.code==="declined"?"":"Could not create the file. Please try again."}}
document.querySelectorAll(".dl").forEach(b=>b.addEventListener("click",()=>exportAs(b.dataset.x)));

buildEditor();render();initDl();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
</script>
</body>
</html>
