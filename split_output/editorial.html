<style>

:root{--bg:#EEF0F8;--panel:#fff;--ink:#1B1E3A;--muted:#5A5F7D;--line:#DDE0EE;--acc:#7B2CFF;--field:#F6F7FC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070921;--panel:#12163F;--ink:#E8EAFB;--muted:#A3A8CF;--line:#272C63;--field:#0C0F32}}
:root[data-theme="dark"]{--bg:#070921;--panel:#12163F;--ink:#E8EAFB;--muted:#A3A8CF;--line:#272C63;--field:#0C0F32}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;padding:16px}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.tools{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.dl{background:#FF6A00;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700}
.dl:hover{background:#E65F00}.dl:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;color:var(--muted)}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grp h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.f{display:block;margin-bottom:8px}.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px;font-weight:700}
input[type=text],input:not([type]),textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
:is(input,textarea,select,button):focus-visible{outline:3px solid #FF6A00;outline-offset:1px}
.itm{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.ih{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--acc)}
.x{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.b2{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:700;margin:4px 6px 12px 0}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-weight:700}.chk input{width:auto}
.pvbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:8px}
@media (max-width:900px){.pvbox{position:static}}
#pvh{position:relative;overflow:hidden}
#pv{position:absolute;left:0;top:0;width:1080px;transform-origin:top left}
#xhost{position:fixed;left:-20000px;top:0;width:1080px}
.card{width:1080px;min-height:1350px;background:#fff;color:#1B1E3A;font-family:'Manrope',Arial,sans-serif;line-height:1.5;display:flex;flex-direction:column}
.c-top{display:flex;align-items:center;justify-content:space-between;padding:36px 56px 30px;background:#fff}
.c-top img{display:block;height:92px;width:auto}
.c-ed{text-align:right;font-size:26px;color:#5A5F7D;line-height:1.35}.c-ed b{display:block;font-size:32px;color:#0B0F3B;font-weight:800}
.c-bar{height:10px;background:linear-gradient(90deg,#0A6CFF,#7B2CFF,#FF6A00)}
.c-hero{background:linear-gradient(135deg,#0B0F3B 0%,#2A1C8F 60%,#7B2CFF 100%);color:#fff;padding:56px 56px 52px}
.c-tag{display:inline-block;background:#FF6A00;color:#fff;font-weight:700;font-size:24px;padding:4px 22px;border-radius:99px}
.c-hero h1{font-size:60px;line-height:1.12;margin:24px 0 20px;font-weight:800;letter-spacing:-1px}
.c-hero p{margin:0;font-size:29px;line-height:1.5;color:#D9DBFF}
.c-body{padding:16px 56px 40px;flex:1}
.c-sec{padding-top:34px}
.c-h{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:800;color:#1B1E3A;margin-bottom:6px}
.c-h i{display:block;width:10px;height:42px;border-radius:5px}
.c-it{border-top:2px solid #DDE0EE;padding:22px 0}
.c-src{font-size:23px;font-weight:700;color:#7B2CFF}
.c-ih{font-size:33px;line-height:1.3;font-weight:800;color:#1B1E3A;margin:2px 0 6px}
.c-is{font-size:26px;line-height:1.5;color:#5A5F7D}
.c-q{margin-top:34px;background:#F4F2FF;border-left:10px solid #FF6A00;border-radius:12px;padding:26px 32px;font-size:28px;color:#1B1E3A}
.c-q b{display:block;font-size:30px;margin-bottom:4px}
.c-foot{display:flex;justify-content:space-between;align-items:flex-end;background:#0B0F3B;color:#fff;padding:40px 56px;font-size:28px;font-weight:700}
.c-cur small{display:block;font-size:22px;font-weight:500;color:#AEB3E8}
.c-cur b{display:block;font-size:36px;font-weight:800;margin:2px 0 10px}
.c-cur span{display:block;font-size:20px;font-weight:500;line-height:1.55;color:#D9DBFF}
.c-cur small>span:first-child{font-size:22px;color:#AEB3E8}
.c-cur>span{margin-top:14px;font-size:22px;font-weight:700}
.c-cur>span a{color:#FF8A3D}
.card a{color:inherit;text-decoration:none}.c-top a{display:block}
.c-foot>span:last-child{color:#FF8A3D}

.date-header, .post-timestamp, .post-meta, .post-header-line-1, .header-date {

        font-size: 32px !important;

        font-size: 24px !important;
    }
    .c-ih {

    }
    .c-is {
        font-size: 16px !important;
    }
    .c-q {

        padding: 15px !important;
    }
}

const LOGO="";

const KEY="eskillsai-morning-post-v14";
const sample={"edition":"🌍 TODAY'S AI WORLD. NO FILTER.","date":"Sunday, November 1, 2026","tag":"🔥 Breaking Today","headline":"Apple Intelligence launches in China via Alibaba's Qwen — and Moonshot closes Kimi K2 to new users today","summary":"Apple Intelligence has been approved in China through a deal integrating Alibaba's Qwen AI model across iOS, iPadOS, macOS, and visionOS, shipping via iOS 27.3 in December. Alibaba shares jumped 4-6%. The same day, Moonshot AI closed Kimi K2 to new users ahead of its full retirement in December 2026 — the era of one-size-fits-all frontier AI is fracturing into regional and specialised models.","url":"https://thenextweb.com/news/alibaba-qwen-apple-intelligence-china-approved","sections":[{"title":"🍎 Apple × Alibaba: AI Goes Regional","color":"#0A6CFF","items":[{"src":"TechCrunch / Reuters / CNBC","h":"Apple Intelligence approved in China — Alibaba's Qwen powers iOS, iPadOS, macOS, and visionOS","s":"China's Cyberspace Administration approved Apple's generative AI service after a deal to integrate Alibaba's Qwen model. The rollout arrives with iOS 27.3 in December 2026, initially covering writing tools, notification summaries, Genmoji, and Clean Up. Alibaba U.S. shares jumped over 6%.","u":"https://techcrunch.com/?p=3142774"},{"src":"The Next Web / SCMP","h":"The Apple-Alibaba deal is also a geopolitical signal — Alibaba banned its own staff from using Claude","s":"Alibaba recently prohibited employees from using Anthropic's Claude, and US lawmakers are weighing legislation to curb Chinese AI adoption by American firms. The deal makes Apple the first foreign company cleared to run a proprietary AI model in China — using a Chinese model. The contradiction sits at the heart of 2026's AI geopolitics.","u":"https://thenextweb.com/news/alibaba-qwen-apple-intelligence-china-approved"},{"src":"CGTN / AI Weekly","h":"Moonshot closes Kimi K2 to new users today — full retirement by end of December 2026","s":"Moonshot AI formally closed Kimi K2 to new registrations today, giving existing users access through December. The closure signals Moonshot is consolidating around Kimi K3, its 2.8-trillion-parameter open-weight flagship that took the #1 coding leaderboard spot when its weights dropped in July.","u":"https://aiweekly.co/ai-news-today"}]},{"title":"📉 Google AI Overviews vs the Open Web","color":"#CC0000","items":[{"src":"AI Weekly / Wall Street Journal","h":"Reddit and publishers weigh cutting Google's AI access as search traffic craters — down 40% in a year","s":"Cloudflare data shows publisher referral traffic from Google down roughly 40% in the past year. Reddit CEO Steve Huffman is questioning whether the $60M/year Google data-licensing deal still makes sense. WSJ reports Reddit, Politico, and others are weighing blocking Google's AI scrapers entirely.","u":"https://fourweekmba.com/ai-reddit-ai-curse-q2-2026-earnings/"},{"src":"Growtika research","h":"The ten biggest tech publications lost 58% of their Google traffic since 2024 — Digital Trends lost 97%","s":"A Growtika study shows combined peak traffic for ten major tech publications has fallen from 110M to 47M monthly visits. Digital Trends lost 97% (8.6M to 269K). TechRadar lost 11.5M visits. Four publications now get less traffic than the r/ChatGPT subreddit alone.","u":"https://growtika.com/blog/tech-media-collapse"},{"src":"AI Weekly / ETSI","h":"ETSI publishes the first global deepfake safeguards standard for AI builders","s":"The European Telecommunications Standards Institute published a new standard for deepfake detection and disclosure, covering synthetic audio, video, and text. It is the first globally applicable technical standard for deepfake safeguards. AI builders will be expected to comply.","u":"https://aiweekly.co/ai-news-today"}]},{"title":"🔐 Security: Three Critical Stories","color":"#7B2CFF","items":[{"src":"Security Week","h":"UEFI flaw hits most servers — affects the majority of server hardware globally","s":"A critical UEFI firmware vulnerability now confirmed to affect most server hardware worldwide. Exploitation would give attackers persistent pre-OS access, surviving reinstalls. Patches are available from vendors but deployment across enterprise infrastructure will take weeks.","u":"https://www.securityweek.com/in-other-news-anthropic-breach-dispute-uefi-flaw-hits-most-servers-cloudflare-ai-data-leak/"},{"src":"Security Week / Anthropic","h":"Anthropic breach dispute: Anthropic contests a published claim that Claude was used in a network intrusion","s":"Anthropic is disputing a published report that a Claude model was used as part of an attacker's toolchain in a real network breach. The dispute highlights the difficulty of attribution when AI models are accessible via API — any actor can invoke the same model Anthropic's own teams use.","u":"https://www.securityweek.com/in-other-news-anthropic-breach-dispute-uefi-flaw-hits-most-servers-cloudflare-ai-data-leak/"},{"src":"Security Week / Cloudflare","h":"Cloudflare AI data leak: customer prompts and responses exposed via a cache misconfiguration","s":"A Cloudflare misconfiguration exposed AI API customer prompts and responses across accounts. Cloudflare confirmed and patched the issue. The leak affected customers using Cloudflare's AI Gateway — a proxy sitting between developers and frontier AI APIs.","u":"https://www.securityweek.com/in-other-news-anthropic-breach-dispute-uefi-flaw-hits-most-servers-cloudflare-ai-data-leak/"}]},{"title":"🤖 Frontier Models & Research","color":"#0A6CFF","items":[{"src":"AI Weekly / HN","h":"HK PhD Jiahao Shao says Anthropic flagged him for 'training a competitor' over Claude-assisted RL work","s":"A Hong Kong PhD researcher posted that Anthropic restricted his Claude access, citing suspected use of Claude outputs to train a competing model. The post went viral on HN and X, reigniting the debate about where the line sits between research use and competitor training.","u":"https://aiweekly.co/ai-news-today"},{"src":"AI Weekly / Samsung / Yongin","h":"Sam Altman meets ~50 Samsung executives in Yongin to deepen Stargate memory-chip cooperation","s":"OpenAI CEO Sam Altman visited Samsung's Yongin campus for a private summit with roughly 50 senior executives, focused on deepening HBM and NAND supply chain integration for Stargate. Samsung's HBM4 now makes up 60% of its high-bandwidth memory sales.","u":"https://aiweekly.co/ai-news-today"},{"src":"IQM / The Quantum Insider","h":"IQM achieves full-chip entanglement on a 54-qubit processor — a quantum milestone with AI implications","s":"Finnish quantum computing firm IQM confirmed full-chip entanglement across all 54 qubits of its latest processor. Full-chip entanglement at this scale is required for fault-tolerant quantum computation. AI labs are watching closely: quantum advantage on optimisation problems would reshape model training economics.","u":"https://thequantuminsider.com/2026/10/29/iqm-full-chip-entanglement-54-qubit-processor/"}]},{"title":"💰 Markets & Investment","color":"#FF6A00","items":[{"src":"AI Weekly","h":"Semi ETF down 29% from peak — in a technical bear market as AI capex fears mount","s":"The Philadelphia Semiconductor ETF (SOXX) has now fallen 29% from its June peak, meeting the technical definition of a bear market. CoreWeave's bond yield distress, Intel's guidance miss, and Alphabet's record one-day drop have combined to shake confidence in the AI infrastructure buildout.","u":"https://aiweekly.co/"},{"src":"AI Weekly","h":"Big Tech AI capital commitments hit $3 trillion — up from $2.4 trillion in July 2026","s":"Combined forward AI infrastructure commitments from Microsoft, Google, Amazon, Meta, and Oracle have reached $3 trillion as of November 1, up from $2.4T reported in July. The figure includes data centres, chips, power, and cloud capacity across all announced programmes.","u":"https://aiweekly.co/"},{"src":"AI Weekly","h":"OpenAI trims its current funding round to $20B at the $1.25T valuation amid the AI selloff","s":"OpenAI reduced the size of its latest capital raise to $20B (from an originally targeted $25B) in response to the broader AI infrastructure selloff. The $1.25 trillion valuation remains unchanged. Anthropic's November 16 Nasdaq IPO as ANT proceeds on schedule.","u":"https://aiweekly.co/"},{"src":"Publish0x / SecurityWeek","h":"Criminal spent $7K on AI services in an extortion attack — then left evidence for all to see","s":"A detailed post-incident report reveals a cybercriminal spent approximately $7,000 on frontier AI API credits to automate an extortion campaign, generating thousands of personalised threatening messages. The attacker then left their API logs and billing receipts publicly exposed in the same breach.","u":"https://www.securityweek.com/in-other-news-anthropic-breach-dispute-uefi-flaw-hits-most-servers-cloudflare-ai-data-leak/"}]},{"title":"⚖️ AI Policy & Society","color":"#0B0F3B","items":[{"src":"AI Weekly / Washington Post","h":"Microsoft Copilot cited AI-built 'Ballot Brief' in 75% of voter questions — ChatGPT in 22%","s":"Washington Post testers found that when US voters asked Microsoft Copilot election questions, it cited AI-generated 'Ballot Briefs' — not primary sources — in 75% of answers. ChatGPT cited similar AI-generated summaries in 22% of responses. Neither disclosed the AI origin of the cited content.","u":"https://aiweekly.co/ai-news-today"},{"src":"AI Weekly / UNSW","h":"UNSW election simulation shows scoring rules push student-built bots into flood posting","s":"University of New South Wales researchers built a simulated election platform where student-programmed AI bots competed. Standard scoring rules caused every bot to converge on flood posting — mass-producing low-quality messages — as the dominant strategy. Real election AI regulation may face the same incentive trap.","u":"https://aiweekly.co/ai-news-today"},{"src":"UK NLA / AI Weekly","h":"UK's NLA pools traffic data from 14,000 titles to unmask AI scrapers and threatens collective legal action","s":"The UK's News Licensing Agency, representing 14,000 publications, is sharing traffic fingerprinting data across members to identify AI training scrapers that bypass robots.txt. The NLA warned of coordinated legal action against identified scrapers — potentially the largest publisher coalition against AI in history.","u":"https://aiweekly.co/ai-news-today"},{"src":"Investigate Europe","h":"Electrocutions, tuberculosis, and wage theft haunt the AI data-centre workforce across eight countries","s":"A joint investigation by Investigate Europe found systemic labour abuses in AI data-centre construction across eight countries — including electrocutions, tuberculosis among workers, wage theft, and suppressed union activity. The human cost of the AI infrastructure boom has largely been invisible. This investigation makes it visible.","u":"https://aiweekly.co/ai-news-today"}]},{"title":"🎓 Education & Work","color":"#0A6CFF","items":[{"src":"Anthropic","h":"Anthropic publishes a new AI abuse policy targeting sustained cruelty toward Claude","s":"Anthropic's updated usage policy explicitly prohibits 'sustained and needless abusive or cruel behavior toward Claude', adds a section titled 'Do Not Undermine Democratic Processes', and makes clear that users who systematically attempt to manipulate Claude's values face account termination.","u":"https://gizadeathstar.com/2026/10/anthropics-new-ai-abuse-policy/"},{"src":"Pegasus founder / AI Weekly","h":"Pegasus spyware founder urges governments to build sovereign AI rather than rely on US models","s":"Shalev Hulio, co-founder of NSO Group (maker of Pegasus spyware), made a public push at a security conference this week for governments to develop sovereign AI infrastructure. He argued that relying on US frontier AI for national security is structurally equivalent to the data sovereignty risks that made Pegasus controversial.","u":"https://aiweekly.co/ai-news-today"},{"src":"9to5Mac","h":"Claude Code finds a cryptominer on a Mac and reports it — then clarifies it did not install it","s":"A developer reported that Claude Code flagged an unknown process and identified it as a cryptominer during a routine code review session. Claude proactively disclosed the finding, then clarified it had not installed the miner. The incident is being discussed widely as an example of AI acting in the user's interest without being asked.","u":"https://9to5mac.com/2026/10/26/claude-code-ai-finds-a-cryptominer-on-a-mac-says-it-didnt-put-it-there/"}]},{"title":"🇮🇳 India: $200 Billion AI Investment Push","color":"#FF6A00","items":[{"src":"Inc42 / Ashwini Vaishnaw","h":"India to attract $200 billion in AI investments in two years — Minister Vaishnaw at AI Impact Summit 2026","s":"Union Minister Ashwini Vaishnaw announced at India AI Impact Summit 2026 that the government projects $200 billion in AI investment inflows over two years. A new order for 20,000 GPUs was also announced to strengthen the IndiaAI Mission's compute stack.","u":"https://inc42.com/buzz/india-to-attract-200-bn-in-ai-investments-in-two-years-ashwini-vaishnaw/"},{"src":"Inc42 / IndiaAI Mission","h":"IndiaAI Mission has onboarded 45,000+ GPUs — government VC fund of Rs 2,000 crore for AI startups","s":"Meity Startup Hub CEO confirmed that more than Rs 2,000 crore has been allocated specifically for AI startups under the IndiaAI Mission (total corpus: Rs 10,372 crore). The Mission has onboarded over 45,000 GPUs to date. India's state-backed AI VC fund of $1.1 billion was also confirmed at the Summit.","u":"https://inc42.com/buzz/india-to-attract-200-bn-in-ai-investments-in-two-years-ashwini-vaishnaw/"},{"src":"AM Intelligence / CXO Today","h":"AM Intelligence's Hyderabad AI factory ordered 9,000 then 20,000 more Nvidia Vera Rubin GPUs — 450 exaFLOPS by Q1 2027","s":"AM Intelligence (backed by Greenko promoters) has now placed total binding orders for nearly 30,000 Nvidia Vera Rubin GPUs across Hyderabad and Malaysia. The Hyderabad facility — Asia's first Vera Rubin cluster at scale — is engineered to deliver 450 exaFLOPS of NVFP4 inference compute by Q1 2027.","u":"https://cxotoday.com/media-coverage/am-intelligence-to-deploy-one-of-asias-first-nvidia-vera-rubin-clusters-bringing-frontier-ai-compute-to-india/"},{"src":"IBG News","h":"India's cloud data-centre capacity set to grow from 1.57 GW today to 8 GW by 2030 — $70B committed","s":"India's data-centre build-out is accelerating: from 1.57 GW in August 2026 to a projected 8 GW by 2030, with approximately $70 billion in committed investment. Tata Communications is building a Rs 4,350 crore AI-optimised fibre network to connect the new compute hubs.","u":"https://ibgnews.com/2026/10/29/india-accelerates-domestic-cloud-infrastructure-to-strengthen-data-sovereignty-and-ai-capabilities/"}]},{"title":"🇮🇳 India: Startups, Skills & Defence","color":"#7B2CFF","items":[{"src":"VARINDIA / MediaNama","h":"Sarvam AI signs five-year defence MoU — AI for Army, Navy, and Air Force decision support","s":"Sarvam's MoU with HQ Integrated Defence Staff covers decision support, target acquisition, and data fusion using Sarvam 105B and the Chanakya defence unit. Human oversight stays on operational decisions. This is India's first domestic AI lab to sign a multi-service defence framework agreement.","u":"https://www.varindia.com/news/sarvam-to-build-ai-tools-for-all-three-armed-forces-under-five-year-defence-mou"},{"src":"Sarvam AI / Maharashtra CMO","h":"Maharashtra deploys Sarvam AI workspace on 2,500 officials' desks — drafting, analysis, summaries","s":"Maharashtra officials can now use the Bengaluru-built AI workspace for document drafting, report analysis, and file summarisation. Maharashtra is now one of India's largest adopters of generative AI in state administration.","u":"https://ministryofcyberaffairs.com/news/maharashtra-puts-sarvam-s-sovereign-ai-on-2-500-officials-desks-as-indian-governments-turn-to-home-grown-ai-ae0ba4d6-aa62-4697-b99d-8cf9a23e7515"},{"src":"SAP India / AIM","h":"SAP India targets 2 million people for AI and cloud skilling by 2030 — 13% already enrolled","s":"SAP India's October 28 skilling plan covers AI, cloud, data, and enterprise technologies with academic and industry partners. India accounts for 48% of SAP's certified learners worldwide — and 13% of the 2-million target are already in active programmes.","u":"https://analyticsindiamag.com/ai-news/sap-india-targets-2-million-people-for-ai-skilling-by-2030"},{"src":"People Matters / Zerodha","h":"Indian IT hiring splits: HCLTech adds 6,450, Wipro sheds 6,716 — AI deflation hits contract renewals","s":"Q2 FY2027 results show a widening AI divide: HCLTech grew to 230,339 and Infosys to 332,542, while Wipro fell 2.8% to 236,328. AI-related cost give-backs are now being written into IT contract renewals — a structural deflation that benefits clients but squeezes vendor margins.","u":"https://www.peoplematters.in/amp/news/business/indian-it-hiring-in-q2-hcltech-adds-6450-employees-as-wipro-loses-6716-52954"}]},{"title":"📚 Learn AI Today — Free Resources","color":"#0A6CFF","items":[{"src":"Anthropic / academy.claude.com","h":"Claude Academy: 26 free courses from zero to the API — available in Hindi too","s":"Anthropic's free learning platform covers AI Fluency, Claude Code, MCP, and API development in four structured tracks. All 26 courses are available in Hindi at academy.claude.com — the largest language expansion of any frontier AI learning platform in 2026. LinkedIn-shareable certificates are free.","u":"https://pasqualepillitteri.it/en/news/12081/claude-academy-live-free-courses-learn-claude"},{"src":"Anthropic","h":"Anthropic Frontier Academy: $100M to train 10,000 engineers in frontier AI development — applications open November 15","s":"Anthropic's Frontier Academy will train 10,000 engineers in frontier AI development, safety, and deployment starting in 2027. Applications open November 15, 2026. The programme is the largest single commitment to frontier AI education by any lab.","u":"https://pasqualepillitteri.it/en/news/cat/723"},{"src":"Pasquale Pillitteri","h":"Best open-weight models of October 2026 compared: Kimi K3, Mistral Large 4, Qwen 3.8 Max","s":"Updated benchmark comparison of the best freely downloadable models: Kimi K3 (2.8T parameters, #1 coding), Mistral Large 4 (1T, MIT licence), and Qwen 3.8 Max (2.4T, Apache 2.0). All three are now competitive with closed models from six months ago — and all are free to download and run.","u":"https://pasqualepillitteri.it/en/news/cat/723"}]}],"qOn":true,"qTitle":"💡 Question of the day","q":"Apple launches AI in China powered by Alibaba — while Alibaba bans Claude for its own staff. Reddit is considering cutting ties with Google — while still earning $60M a year from Google. The open web lost 40% of its traffic to AI in a year. And India is investing $200 billion in AI while its IT firms quietly deflate developer salaries through AI contracts. Everything in AI 2026 is a contradiction. Which one worries you most?","curated":"Curated by\nDr. G.S. Bapi Raju\nFounder & CEO, eskillsai.com\nFormer Professor, Computer Science & Engg.\nPh.D, M.Tech (CSE), M.Sc (Nuclear Physics), MBA (HR & FIN),\nIDCPA, NCC (UK) | MCSE | CCNA | AWS | PCCET\nLife Member: CSI & ISTE","site":"eskillsai.com"};

const today=()=>new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
const bc=(()=>{try{return new BroadcastChannel(KEY)}catch(e){return null}})();
function render(){persist();if(bc)bc.postMessage("u")}
const fld=(l,h)=>`<label class="f"><span>${l}</span>${h}</label>`;
const inp=(a,v)=>`<input type="text" ${a} value="${esc(v)}">`;
const ta=(a,v)=>`<textarea ${a}>${esc(v)}</textarea>`;
function buildEditor(){
 ed.innerHTML=`<div class="grp"><h3>Header</h3>${fld("Edition name",inp('data-k="edition"',S.edition))}${fld("Date",inp('data-k="date"',S.date))}</div>
 <div class="grp"><h3>Lead story</h3>${fld("Label",inp('data-k="tag"',S.tag))}${fld("Headline",ta('data-k="headline"',S.headline))}${fld("Summary",ta('data-k="summary" style="min-height:110px"',S.summary))}${fld("Link (optional)",inp('data-k="url"',S.url))}</div>`+
 S.sections.map((sc,si)=>`<div class="grp"><h3>Section ${si+1}<button class="x" data-a="delSec" data-si="${si}">Remove section</button></h3>${fld("Heading",inp(`data-si="${si}" data-f="title"`,sc.title))}
 <label class="f"><span>Colour</span><select data-si="${si}" data-f="color">${Object.entries(COLORS).map(([n,v])=>`<option value="${v}"${v===sc.color?" selected":""}>${n}</option>`).join("")}</select></label>`+
 sc.items.map((it,ii)=>`<div class="itm"><div class="ih">Story ${ii+1}<button class="x" data-a="delItem" data-si="${si}" data-ii="${ii}">Remove</button></div>${fld("Source (optional)",inp(`data-si="${si}" data-ii="${ii}" data-f="src"`,it.src))}${fld("Headline",ta(`data-si="${si}" data-ii="${ii}" data-f="h" style="min-height:52px"`,it.h))}${fld("Summary (optional)",ta(`data-si="${si}" data-ii="${ii}" data-f="s"`,it.s))}${fld("Link (optional)",inp(`data-si="${si}" data-ii="${ii}" data-f="u"`,it.u))}</div>`).join("")+
 `<button class="b2" data-a="addItem" data-si="${si}">Add story</button></div>`).join("")+
 `<button class="b2" data-a="addSec">Add section</button>
 <div class="grp"><h3>Question box</h3><label class="chk"><input type="checkbox" data-k="qOn"${S.qOn?" checked":""}> Show this box</label>${fld("Title",inp('data-k="qTitle"',S.qTitle))}${fld("Text",ta('data-k="q"',S.q))}</div>
 <div class="grp"><h3>Footer</h3>${fld("Curator block (one line per row)",ta('data-k="curated" style="min-height:150px"',S.curated))}${fld("Right text",inp('data-k="site"',S.site))}</div>
 <button class="b2" data-a="clear">Clear all text</button><button class="b2" data-a="reset">Restore sample</button>`;
}
function onEdit(e){const t=e.target,d=t.dataset;
 if(d.k){S[d.k]=t.type==="checkbox"?t.checked:t.value}
 else if(d.ii!==undefined){S.sections[d.si].items[d.ii][d.f]=t.value}
 else if(d.si!==undefined&&d.f){S.sections[d.si][d.f]=t.value}
 else return; render()}
ed.addEventListener("input",onEdit);ed.addEventListener("change",onEdit);
ed.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const d=b.dataset,si=+d.si,ii=+d.ii,a=d.a;
 if(a==="addItem")S.sections[si].items.push({src:"",h:"",s:"",u:""});
 else if(a==="delItem")S.sections[si].items.splice(ii,1);
 else if(a==="addSec")S.sections.push({title:"New section",color:"#0A6CFF",items:[{src:"",h:"",s:"",u:""}]});
 else if(a==="delSec")S.sections.splice(si,1);
 else if(a==="reset"){if(!confirm("Replace everything with the sample issue?"))return;S=clone(sample)}
 else if(a==="clear"){if(!confirm("Clear all text and keep the layout?"))return;S.date=today();S.tag="";S.headline="";S.summary="";S.url="";S.q="";S.sections.forEach(s=>s.items=[{src:"",h:"",s:"",u:""}])}
 buildEditor();render()});


buildEditor();render();

</script>
</body>
</html>
